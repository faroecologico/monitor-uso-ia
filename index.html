<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Uso restante</title>
<style>
  :root {
    --tinta: rgba(255, 255, 255, 0.96); --tenue: rgba(255, 255, 255, 0.72);
    --riel: rgba(255, 255, 255, 0.18); --bien: #6ee7a8; --ojo: #ffd166; --mal: #ff7a6b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: transparent; overflow: hidden; }
  body {
    color: var(--tinta); user-select: none; -webkit-app-region: drag;
    font: 12px/1.2 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
  }
  /* fuera de la ventana flotante (en un navegador) se pinta un fondo para poder leer */
  body.navegador { background: linear-gradient(135deg, #1d2b4a, #3a2148 55%, #14323a); min-height: 100vh; padding: 24px; }

  #vidrio {
    position: relative; width: 140px; padding: 10px 10px 8px; border-radius: 14px;
    display: flex; justify-content: space-between;
    /* velo oscuro muy leve: deja ver el escritorio y sostiene el texto claro */
    background:
      radial-gradient(120% 70% at 0% 0%, rgba(255, 255, 255, 0.10), transparent 60%),
      rgba(16, 18, 24, 0.30);
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.16), inset 0 1px 0 rgba(255, 255, 255, 0.22);
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8), 0 0 6px rgba(0, 0, 0, 0.5);
  }

  .medidor { width: 54px; display: flex; flex-direction: column; align-items: center; }
  .aro { position: relative; width: 50px; height: 50px; }
  .anillo { width: 100%; height: 100%; transform: rotate(-90deg); }
  .aro circle { fill: none; stroke-width: 4.5; }
  .aro .fondo { stroke: var(--riel); }
  .aro .resto { stroke-linecap: round; transition: stroke-dashoffset 0.6s cubic-bezier(0.2, 0.8, 0.2, 1), stroke 0.3s ease; }
  .logo { position: absolute; inset: 0; margin: auto; width: 21px; height: 21px; filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.45)); }
  .queda { margin-top: 5px; font-size: 15px; font-weight: 600; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
  .queda i { font-style: normal; font-size: 10px; font-weight: 500; opacity: 0.75; margin-left: 1px; }
  .reinicio { margin-top: 1px; font-size: 9.5px; color: var(--tenue); font-variant-numeric: tabular-nums; white-space: nowrap; }
</style>
</head>
<body>
<div id="vidrio">
  <div class="medidor" id="codex"></div>
  <div class="medidor" id="claude"></div>
</div>
<script>
const $ = (id) => document.getElementById(id);
const enVentana = Boolean(window.flotante);
if (!enVentana) { document.body.classList.add('navegador'); }

// Logos de Simple Icons (simpleicons.org)
const LOGOS = {

  claude: { color: '#D97757', trazo: 'm4.7144 15.9555 4.7174-2.6471.079-.2307-.079-.1275h-.2307l-.7893-.0486-2.6956-.0729-2.3375-.0971-2.2646-.1214-.5707-.1215-.5343-.7042.0546-.3522.4797-.3218.686.0608 1.5179.1032 2.2767.1578 1.6514.0972 2.4468.255h.3886l.0546-.1579-.1336-.0971-.1032-.0972L6.973 9.8356l-2.55-1.6879-1.3356-.9714-.7225-.4918-.3643-.4614-.1578-1.0078.6557-.7225.8803.0607.2246.0607.8925.686 1.9064 1.4754 2.4893 1.8336.3643.3035.1457-.1032.0182-.0728-.164-.2733-1.3539-2.4467-1.445-2.4893-.6435-1.032-.17-.6194c-.0607-.255-.1032-.4674-.1032-.7285L6.287.1335 6.6997 0l.9957.1336.419.3642.6192 1.4147 1.0018 2.2282 1.5543 3.0296.4553.8985.2429.8318.091.255h.1579v-.1457l.1275-1.706.2368-2.0947.2307-2.6957.0789-.7589.3764-.9107.7468-.4918.5828.2793.4797.686-.0668.4433-.2853 1.8517-.5586 2.9021-.3643 1.9429h.2125l.2429-.2429.9835-1.3053 1.6514-2.0643.7286-.8196.85-.9046.5464-.4311h1.0321l.759 1.1293-.34 1.1657-1.0625 1.3478-.8804 1.1414-1.2628 1.7-.7893 1.36.0729.1093.1882-.0183 2.8535-.607 1.5421-.2794 1.8396-.3157.8318.3886.091.3946-.3278.8075-1.967.4857-2.3072.4614-3.4364.8136-.0425.0304.0486.0607 1.5482.1457.6618.0364h1.621l3.0175.2247.7892.522.4736.6376-.079.4857-1.2142.6193-1.6393-.3886-3.825-.9107-1.3113-.3279h-.1822v.1093l1.0929 1.0686 2.0035 1.8092 2.5075 2.3314.1275.5768-.3218.4554-.34-.0486-2.2039-1.6575-.85-.7468-1.9246-1.621h-.1275v.17l.4432.6496 2.3436 3.5214.1214 1.0807-.17.3521-.6071.2125-.6679-.1214-1.3721-1.9246L14.38 17.959l-1.1414-1.9428-.1397.079-.674 7.2552-.3156.3703-.7286.2793-.6071-.4614-.3218-.7468.3218-1.4753.3886-1.9246.3157-1.53.2853-1.9004.17-.6314-.0121-.0425-.1397.0182-1.4328 1.9672-2.1796 2.9446-1.7243 1.8456-.4128.164-.7164-.3704.0667-.6618.4008-.5889 2.386-3.0357 1.4389-1.882.929-1.0868-.0062-.1579h-.0546l-6.3385 4.1164-1.1293.1457-.4857-.4554.0608-.7467.2307-.2429 1.9064-1.3114Z' },
};

function falta(ms) {
  const m = Math.max(0, Math.round((ms - Date.now()) / 60000));
  const d = Math.floor(m / 1440), h = Math.floor((m % 1440) / 60), mi = m % 60;
  return d ? `${d} d ${h} h` : h ? `${h} h ${mi} m` : `${mi} min`;
}

const MOTIVOS = {
  'sin-sesion': 'Falta iniciar sesión en el CLI de Claude',
  'vencida': 'Sesión vencida: abre claude en una terminal',
};
const RADIO = 21, VUELTA = 2 * Math.PI * RADIO;

// Sólo el total semanal de cada servicio: el aro lleno es 100 % restante
function medidor(cual, nombre, ventanas, aviso) {
  const v = ventanas?.find((x) => x.etiqueta === 'Semana');
  const queda = v ? Math.max(0, Math.min(100, 100 - v.usado)) : 0;
  const color = queda > 40 ? 'var(--bien)' : queda > 15 ? 'var(--ojo)' : 'var(--mal)';
  const reinicio = !v ? '' : v.vencida ? 'reiniciado' : v.reinicia ? falta(v.reinicia) : '';
  const ayuda = v ? `${nombre}: queda ${Math.round(queda)} % de la semana` : `${nombre}: ${aviso || 'sin dato semanal'}`;
  const l = LOGOS[cual];
  $(cual).title = ayuda;
  $(cual).innerHTML = `<div class="aro">
      <svg class="anillo" viewBox="0 0 50 50"><circle class="fondo" cx="25" cy="25" r="${RADIO}"/>
        <circle class="resto" cx="25" cy="25" r="${RADIO}" stroke="${color}" stroke-dasharray="${VUELTA}" stroke-dashoffset="${VUELTA * (1 - queda / 100)}"/></svg>
      <svg class="logo" viewBox="0 0 24 24" fill="${l.color}"><path d="${l.trazo}"/></svg>
    </div>
    <div class="queda" style="color:${v ? color : 'var(--tenue)'}">${v ? Math.round(queda) + '<i>%</i>' : '—'}</div>
    <div class="reinicio">${reinicio}</div>`;
}

let ultimo = null;
function pintar() {
  if (!ultimo) return;
  const { codex, claude } = ultimo;
  medidor('codex', 'Codex', codex.ventanas, codex.nota);
  const e = claude;
  medidor('claude', 'Claude', e.ventanas, e.ok ? null : MOTIVOS[e.motivo] || `no pude leerlo (${e.motivo})`);
  if (enVentana) window.flotante.alto($('vidrio').offsetHeight);
}
async function cargar() {
  try { ultimo = await (await fetch('/api/uso')).json(); } catch { /* se reintenta al minuto */ }
  pintar();
}
cargar();
setInterval(cargar, 60000);
</script>
</body>
</html>
